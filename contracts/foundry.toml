[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
# Robinhood Chain berbasis Arbitrum Orbit. "shanghai" dipilih konservatif;
# naikkan ke "cancun" jika sudah dipastikan didukung chain target.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
# Test vector Suit dibaca oleh test/SuitCommitVectors.t.sol
fs_permissions = [{ access = "read", path = "./test-vectors" }]

[fuzz]
runs = 1000

[rpc_endpoints]
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC}"
robinhood = "${ROBINHOOD_RPC}"

[fmt]
line_length = 120
